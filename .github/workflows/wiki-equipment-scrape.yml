name: Weekly wiki item scrape

on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape-items:
    name: Plan equipment and item ID updates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-wiki-scraper.txt

      - name: Install scraper dependencies
        run: python -m pip install -r requirements-wiki-scraper.txt

      - name: Run scraper tests
        run: python -m unittest test_wiki_item_scraper

      - name: Fetch wiki data
        run: python wiki_item_scraper.py fetch --out-dir artifacts/wiki-scrape/data

      # Read-only: plan opens a read-only session and only writes files. Point DB_URL at a
      # read-only database role so that holds even if the script changes.
      - name: Plan against the database
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          python wiki_item_scraper.py plan \
            --data-dir artifacts/wiki-scrape/data \
            --out-dir artifacts/wiki-scrape/plan

      - name: Upload reports and apply.sql
        uses: actions/upload-artifact@v4
        with:
          name: wiki-item-scrape
          path: artifacts/wiki-scrape/
          if-no-files-found: error
