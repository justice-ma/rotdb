name: Weekly wiki equipment scrape

on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Optional page limit for a test run"
        required: false
        type: string

permissions:
  contents: read

jobs:
  scrape-equipment:
    name: Generate equipment update SQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-wiki-scraper.txt

      - name: Install scraper dependencies
        run: python -m pip install -r requirements-wiki-scraper.txt

      - name: Run scraper
        env:
          DB_URL: ${{ secrets.DB_URL }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
        run: |
          mkdir -p artifacts/wiki-equipment

          args=()
          if [ -n "$MAX_PAGES" ]; then
            args+=(--max-pages "$MAX_PAGES")
          fi

          python wiki_equipment_update_scraper.py \
            --api "https://runescape.wiki/api.php" \
            --out artifacts/wiki-equipment/insert_new_equipment.sql \
            --misses artifacts/wiki-equipment/new_equipment_misses.txt \
            --summary artifacts/wiki-equipment/equipment_scrape_summary.json \
            "${args[@]}"

      - name: Upload generated SQL and logs
        uses: actions/upload-artifact@v4
        with:
          name: wiki-equipment-scrape
          path: artifacts/wiki-equipment/
          if-no-files-found: error
